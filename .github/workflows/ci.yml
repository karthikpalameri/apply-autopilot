name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Force UTF-8 stdio so emoji output doesn't crash Windows' cp1252 console
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Repo self-test (compile all .py + verify skill links)
        run: python validate.py

      - name: Test suite (skills / code / logic / mcp / searxng / parsing)
        run: python tests/run_tests.py

  privacy:
    name: privacy scan (no personal data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail if any tracked config holds personal data
        shell: bash
        run: |
          set -e
          if git ls-files | grep -qE '^config/(user\.json|profile\.json|profile\.md|progress\.json|targets\.json|resume\.md5)$'; then
            echo "::error::personal config file is tracked"; exit 1
          fi
          if git grep -nI -E 'abhishek\.garg|hr@m2pfintech|JioStar2026QA|/Users/kk/' -- . ':!.github/workflows/ci.yml' ; then
            echo "::error::personal data found in tracked files"; exit 1
          fi
          echo "privacy scan OK — zero personal data"
