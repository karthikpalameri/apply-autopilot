# Quality gates for job-apply-hub.
#
# Run:  uvx ruff check .            (no install needed — uvx fetches it on demand)
#       uvx ruff check --fix .      (applies the 3-7 safe fixes)
#
# The rules below are chosen to enforce exactly the three properties this repo
# cares about, and nothing cosmetic. Deliberately NOT enabled:
#   E501 (line too long) — the apply scripts embed minified JS in Python
#        strings; the longest line is 469 chars and must stay on one line.
#   I    (import sorting) — would rewrite every `import json, os, sys` into one
#        line each across 45 files, for no behavioural gain.
#   TRY003 (long exception messages) — this repo raises long, diagnostic
#        messages on purpose; that is the opposite of a defect here.

[tool.ruff]
target-version = "py313"
line-length = 120

# third_party/ is vendored (freehire CLI, git submodule) — never lint someone
# else's code, and never let it hide our own findings.
extend-exclude = ["third_party", "archive", ".venv", "temp", "scratch", "runtime/mcp-session"]

[tool.ruff.lint]
select = [
  "F",      # pyflakes: unused imports/vars, redefinitions, duplicate dict keys  -> DRY
  "E9",     # syntax/runtime errors only
  "B",      # bugbear: unused loop vars, mutable defaults, silent zip mismatch    -> DRY
  "C901",   # cyclomatic complexity                                             -> KISS
  "PLR0912",# too many branches                                                -> KISS
  "PLR0915",# too many statements                                              -> KISS
  "SIM",    # collapsed/simplifiable constructs                                  -> KISS
  "S110",   # try/except/pass  -> "consider logging the exception"                -> LOGS
  "S112",   # try/except/continue -> same                                        -> LOGS
]

[tool.ruff.lint.mccabe]
max-complexity = 12          # current worst offenders are 16 and 20; see below

[tool.ruff.lint.per-file-ignores]
# CLI entry points print their result; that IS their output. Library code in
# core/ must use log.* instead — see skills/REFERENCE.md#logging.
"find/*.py" = ["SIM115"]      # one-shot json.load(open(...)) in a CLI is fine
"apply/*.py" = ["SIM115"]

# Generic cross-platform machinery (hub.py, wizards, tests, validation) is made
# of one-shot scripts: a bare open() that reads/writes once and exits is fine,
# and the wizards' branching is inherent to covering macOS/Linux/Windows.
"hub.py" = ["SIM115"]
"setup.py" = ["SIM115", "PLR0915"]
"installer.py" = ["C901", "PLR0912"]
"eval.py" = ["C901", "PLR0915"]
"validate.py" = ["SIM115"]
"resume_parser.py" = ["SIM115"]
"infra/searxng/setup.py" = ["SIM115"]
"tests/*.py" = ["SIM115"]

# KISS debt, explicit and per-function. These are the only two functions over
# the complexity budget; everything else is under it, so a NEW violation
# anywhere else still fails the gate. To remove a line here, split the function.
#   find/preflight.py::main                          complexity 16, 17 branches, 74 stmts
#   find/tracker_reconcile.py::collect_applications   complexity 20, 13 branches
"find/preflight.py" = ["SIM115", "C901", "PLR0912", "PLR0915"]
"find/tracker_reconcile.py" = ["SIM115", "C901", "PLR0912"]

# Known KISS debt, kept explicit so it cannot grow silently. Removing a line
# here means the function was split; adding one needs a reason.
#   find/preflight.py::main                complexity 16, 17 branches, 74 stmts
#   find/tracker_reconcile.py::collect_applications  complexity 20
#   installer.py::install_commands / install_system_tools  (cross-platform wizard)
#   eval.py::build_cases / setup.py::main   (readiness evaluation + setup wizard)

[tool.ruff.lint.isort]
known-first-party = ["core", "config", "find", "apply"]
